name: Operations Validation
on:
  pull_request:
    branches: [main, develop, 'fix/sdd-*', 'feat/sdd-*']
  workflow_call:
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Immutable release and rollback simulation
        run: |
          node scripts/validation/observability-config.mjs
          node scripts/validation/release-simulation.mjs
      - name: Redis memory pressure and recovery
        run: bash scripts/validation/redis-pressure.sh
      - name: Install isolated restore test utility
        run: sudo apt-get update -qq && sudo apt-get install -y restic
      - name: PostgreSQL and MinIO encrypted backup restore
        run: bash scripts/validation/backup-restore.sh
      - name: Observability in an empty isolated environment
        run: bash scripts/validation/observability.sh
