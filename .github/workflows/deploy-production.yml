name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm production deployment"
        required: true

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  # ── 0. Manual confirmation guard ─────────────────────────────────────────────
  confirm:
    name: Confirm Manual Action
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Deployment not confirmed. Type 'deploy' in the confirm field."
            exit 1
          fi

  # ── Security scan (CodeQL + secrets) ─────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ (github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000') && github.event.before || 'HEAD~1' }}
          head: HEAD
          extra_args: --exclude-paths=.trufflehogignore

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ── Tests, lint, dependency audit ────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          PNPM_ALLOW_BUILD: "@prisma/engines,bcrypt,esbuild,msgpackr-extract,msw,prisma,sharp,unrs-resolver"

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test:run

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  # ── Build, push to ghcr.io, scan image ───────────────────────────────────────
  build:
    name: Build & Push
    # Garante que se for workflow_dispatch, o job confirm PRECISA passar antes do build rodar
    needs: [confirm, security-scan, test]
    if: always() && (needs.confirm.result == 'success' || needs.confirm.result == 'skipped') && needs.security-scan.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalise owner to lowercase
        id: meta
        run: echo "owner=$(echo '${{ env.OWNER }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/app:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/app:prod
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/app:prod
          cache-to: type=inline

      - name: Build and push notification-service image
        uses: docker/build-push-action@v6
        with:
          context: ./notification-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/notification-service:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/notification-service:prod
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/notification-service:prod
          cache-to: type=inline

      - name: Build and push auth-service image
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/auth-service:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/auth-service:prod
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/auth-service:prod
          cache-to: type=inline

      - name: Build and push api-gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:prod
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:prod
          cache-to: type=inline

      - name: Build and push file-service image
        uses: docker/build-push-action@v6
        with:
          context: ./file-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/file-service:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/file-service:prod
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/file-service:prod
          cache-to: type=inline

      - name: Build and push project-service image
        uses: docker/build-push-action@v6
        with:
          context: ./project-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/project-service:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/project-service:prod
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/project-service:prod
          cache-to: type=inline

      - name: Build and push sprint-service image
        uses: docker/build-push-action@v6
        with:
          context: ./sprint-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/sprint-service:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/sprint-service:prod
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/sprint-service:prod
          cache-to: type=inline

      - name: Scan app image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan notification-service image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/notification-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan auth-service image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/auth-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan api-gateway image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan file-service image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/file-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan project-service image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/project-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan sprint-service image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/sprint-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

  # ── Trigger deploy on VPS ─────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger production deploy
        run: |
          curl -sf --max-time 300 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -d '{"sha":"${{ github.sha }}","env":"production"}' \
            "${{ secrets.PRODUCTION_WEBHOOK_URL }}"
