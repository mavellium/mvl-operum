global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: app
    metrics_path: /api/metrics
    bearer_token_file: /etc/prometheus/metrics.token
    static_configs:
      - targets: ["app:3000"]
  - job_name: services
    metrics_path: /health/metrics
    bearer_token_file: /etc/prometheus/metrics.token
    static_configs:
      - targets: ["api-gateway:4000", "auth-service:4001", "project-service:4002", "sprint-service:4003", "notification-service:4004", "file-service:4005", "mcp-server:4006"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121", "redis-queue-exporter:9121", "redis-cache-exporter:9121"]
